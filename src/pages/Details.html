<a
  class="back-link"
  href="/"
  data-route
>
  Voltar ao catálogo
</a>
<div
  data-status
  role="status"
  aria-live="polite"
></div>
<article
  class="detail-layout"
  hidden
>
  <div class="detail-poster">
    <img alt="" />
    <span
      class="poster-fallback"
      hidden
    >
      Cartaz indisponível
    </span>
  </div>
  <div class="detail-info">
    <div class="detail-meta"></div>
    <h1></h1>
    <p class="tagline"></p>
    <p class="genres"></p>
    <h2>Sinopse</h2>
    <p class="overview"></p>
    <div class="detail-actions">
      <button
        type="button"
        class="btn btn-danger"
        data-toggle-favorite
      ></button>
      <a
        class="btn btn-outline-light"
        data-trailer
        target="_blank"
        rel="noopener noreferrer"
        hidden
      >
        ▶ Assistir trailer
      </a>
      <p
        data-no-trailer
        class="small muted"
        hidden
      >
        Trailer não disponível para este filme.
      </p>
    </div>
    <p
      class="save-message"
      role="status"
      aria-live="polite"
    ></p>
  </div>
</article>
